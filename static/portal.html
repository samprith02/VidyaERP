<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="theme-color" content="#111827"/>
<title>VidyaERP · My campus</title>
<style>
:root{--bg:#f2f4f7;--line:#e4e7ec;--line2:#d0d5dd;--txt:#101828;--mut:#667085;--dim:#98a2b3;--acc:#3157d5;--acc2:#6654c7;
  --good:#16845b;--warn:#b15c00;--bad:#c43247;--amber:#c96a0a;--panel2:#f8fafc;--panel3:#f1f5f9;
  --shadow-xs:0 1px 2px rgba(16,24,40,.05);--shadow-sm:0 1px 3px rgba(16,24,40,.08),0 1px 2px rgba(16,24,40,.04);--shadow-md:0 8px 24px rgba(16,24,40,.09)}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--txt);font:14px/1.5 Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit}
.app{height:100%;display:flex;flex-direction:column}
header{flex:0 0 60px;display:flex;align-items:center;gap:12px;padding:0 20px;background:#111827;color:#fff}
.logo{width:34px;height:34px;border-radius:9px;background:#fff;color:#111827;display:grid;place-items:center;font:700 14px Georgia,serif}
.brand b{display:block;font-size:13.5px}.brand span{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:#98a2b3}
.spacer{flex:1}
.me{position:relative;display:flex;align-items:center;gap:10px;cursor:pointer;padding:5px 8px;border-radius:9px}
.me:hover{background:rgba(255,255,255,.07)}
.me .av{width:32px;height:32px;border-radius:9px;background:#3157d5;display:grid;place-items:center;font-size:11px;font-weight:750}
.me .n{font-size:12.5px;font-weight:600}.me .r{font-size:10.5px;color:#98a2b3}
.menu{display:none;position:absolute;right:0;top:calc(100% + 6px);min-width:200px;padding:6px;border-radius:10px;background:#fff;box-shadow:var(--shadow-md);z-index:30}
.me.open .menu{display:block}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:7px;color:#344054;font-size:12.5px;cursor:pointer}
.menu button:hover{background:#f2f4f7}
.demo{margin-left:6px;padding:2px 7px;border-radius:5px;background:#3a2a12;color:#ffc46b;font-size:9px;font-weight:750;letter-spacing:.06em;text-transform:uppercase}
.tabs{display:none}
main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:0}
.col{min-height:0;overflow:auto}
.day{padding:22px 24px 30px;border-right:1px solid var(--line)}
.day .hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.day .hd h2{margin:0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.chat{display:flex;flex-direction:column;background:#fff;min-height:0}
.stream{flex:1;min-height:0;overflow:auto;padding:22px 22px 12px;display:flex;flex-direction:column;gap:18px}
.msg{display:flex;gap:10px;max-width:100%}
.msg .ava{flex:0 0 28px;height:28px;border-radius:8px;background:#182230;color:#fff;display:grid;place-items:center;font-size:9.5px;font-weight:750}
.msg.user{align-self:flex-end;flex-direction:row-reverse;max-width:88%}
.msg.user .ava{background:#e4e7ec;color:#475467}
.msg.user .bubble{padding:9px 12px;border:1px solid #d9e2ff;border-radius:10px 3px 10px 10px;background:#f2f5ff;color:#20376c}
.bubble{min-width:0;flex:1;color:#344054}
.bubble p{margin:0 0 8px}.bubble p:last-child{margin:0}
.path{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.path span{padding:1px 6px;border-radius:4px;background:#f2f4f7;color:#667085;font-size:9.5px}
.path span.e{background:#fff0f2;color:var(--bad)}.path span.w{background:#fff8ed;color:var(--warn)}.path span.h{background:#f5f0ff;color:#6654c7}
.composer{padding:10px 18px 14px;border-top:1px solid var(--line);background:#fff}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);border-radius:999px;background:#fff;color:#475467;padding:5px 11px;font-size:11.5px;cursor:pointer;white-space:nowrap}
.chip:hover{border-color:#a9b8e6;color:#29469d;background:#f7f9ff}
.inp{display:flex;gap:8px;align-items:flex-end;padding:8px 8px 8px 12px;border:1px solid #cfd5df;border-radius:12px}
.inp:focus-within{border-color:#8fa4e5;box-shadow:0 0 0 3px rgba(49,87,213,.09)}
textarea{flex:1;border:0;outline:0;resize:none;min-height:28px;max-height:120px;padding:4px 0;background:transparent}
.send{height:36px;padding:0 16px;border:0;border-radius:9px;background:var(--acc);color:#fff;font-weight:600;cursor:pointer}
.typing{display:flex;gap:4px;padding:8px 0}.typing i{width:5px;height:5px;border-radius:50%;background:#7f8fac;animation:t 1.1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes t{0%,60%,100%{opacity:.3}30%{opacity:1}}
.loading{color:var(--mut);font-size:12px}
/* ---- blocks (same markup as the Registrar's console; blocks.js renders it) ---- */
h4.blk{margin:16px 0 7px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#667085;font-weight:700}
table{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
th{text-align:left;color:#667085;font-size:9.5px;font-weight:700;letter-spacing:.065em;text-transform:uppercase;padding:8px 10px;border-bottom:1px solid var(--line);background:#f8fafc;white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid #edf0f4;color:#344054;vertical-align:top}
tbody tr:last-child td{border-bottom:0}
.tblwrap{max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:9px;background:#fff;box-shadow:var(--shadow-xs)}
.tblwrap th{position:sticky;top:0}.tblwrap.dense td,.tblwrap.dense th{padding:6px 9px;font-size:11px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:8px 0 2px}
.card{background:#fff;border:1px solid var(--line);border-radius:9px;padding:11px 12px;box-shadow:var(--shadow-xs)}
.card .l{font-size:9.5px;color:#667085;text-transform:uppercase;letter-spacing:.055em;font-weight:700}
.card .v{margin-top:4px;font-size:20px;font-weight:670;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.card .s{margin-top:3px;font-size:10.5px;color:#98a2b3}
.card.good{border-top:2px solid #38a37d}.card.bad{border-top:2px solid #d75868}.card.warn{border-top:2px solid #d88b34}
.card.good .v{color:#126b4d}.card.bad .v{color:#a92c3d}.card.warn .v{color:#92500c}
.notice{position:relative;margin:8px 0;padding:10px 12px 10px 14px;border:1px solid var(--line);border-radius:8px;background:#fff}
.notice:before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:2px;background:var(--acc)}
.notice .a{font-size:9px;color:#526cb9;letter-spacing:.065em;text-transform:uppercase;font-weight:750}
.notice .t{margin:3px 0 2px;font-weight:650;font-size:12px}.notice .b{font-size:11.5px;color:#667085}.notice .ch{font-size:9.5px;color:#98a2b3}
.bars{display:grid;gap:7px;margin:8px 0;padding:12px 14px;border:1px solid var(--line);border-radius:9px;background:#fff}
.brow{display:grid;grid-template-columns:minmax(110px,40%) minmax(0,1fr) 84px;gap:10px;align-items:center;font-size:11.5px}
.brow .bl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.brow .bt{height:9px;border-radius:5px;background:#eef1f5;overflow:hidden;position:relative}
.brow .bt i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:linear-gradient(90deg,#6f89dd,#3157d5)}
.brow .bt i.over{background:linear-gradient(90deg,#e58a96,#c43247)}.brow .bt i.low{background:linear-gradient(90deg,#e7b26b,#c96a0a)}
.brow .bv{color:var(--mut);font-size:11px;text-align:right}
.ck{margin:8px 0;border:1px solid var(--line);border-radius:9px;background:#fff;overflow:hidden}
.ck .row{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid #edf0f4;font-size:12px}
.ck .row:last-child{border-bottom:0}.ck .ic{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:800;color:#fff;background:var(--good)}
.ck .row.no .ic{background:var(--bad)}.ck .who{font-size:9.5px;color:var(--dim)}.ck .dt{color:var(--mut);font-size:11px;text-align:right}
.gridwrap{overflow:auto;margin:8px 0;border:1px solid var(--line);border-radius:9px;background:#fff}
.ttg{width:100%;min-width:760px;border-collapse:separate;border-spacing:0;font-size:10.5px}
.ttg th{text-align:center;font-size:9px}.ttg th.ph{text-align:left}.ttg td{height:54px;padding:0;border-right:1px solid #edf0f4;border-bottom:1px solid #edf0f4}
.ttg td.dh{width:60px;background:#f8fafc;text-align:center;font-weight:650;font-size:10px}
.cell{height:100%;padding:6px 7px;border-left:2px solid transparent}.cell .s{color:#263b70;font-weight:650}.cell .f{color:#667085;font-size:9.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cell .r{color:#a0a9b7;font-size:9px}
.cell.has{background:#f8faff;border-left-color:#6f89dd}.cell.lab{background:#f7f5ff;border-left-color:#8876cb}.cell.act{background:#fafbfc;border-left-color:#a8b0bd}.cell.ovr{background:#fff8ed;border-left-color:var(--amber)}
.cell.off{padding-top:16px;color:#b2bac6;font-size:9px;text-align:center;text-transform:uppercase}.ttg td.over{background:#f4f6f8}
.ttg th.brk,.ttg td.brk{width:14px;min-width:14px;background:#f2f4f7}.ttg th.brk span{writing-mode:vertical-rl;font-size:7.5px;color:#98a2b3}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin:4px 0 8px;color:#667085;font-size:10px}.legend i{display:inline-block;width:8px;height:8px;margin-right:5px;border-radius:2px}
.plan{margin:10px 0;border:1px solid var(--line);border-radius:10px;background:#fff;overflow:hidden}
.plan .ph{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);background:#fbfcfd}
.pcode{width:26px;height:26px;border:1px solid #b8c5ec;border-radius:6px;display:grid;place-items:center;font-weight:750;color:#2646aa;background:#f0f4ff}
.tag{margin-left:auto;padding:2px 7px;border:1px solid #b5d6c8;border-radius:5px;background:#f0f9f5;color:#126b4d;font-size:9px;font-weight:700;text-transform:uppercase}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:10px 12px;border-bottom:1px solid var(--line)}
.metric .l{font-size:9px;color:#667085;text-transform:uppercase;font-weight:700}.metric .n{float:right;font-size:11px;font-weight:700}
.bar{height:4px;margin-top:6px;border-radius:4px;background:#e9edf3;overflow:hidden}.bar i{display:block;height:100%;background:#6f89dd}
.wts,.incomp{padding:6px 12px;font-size:10.5px;color:var(--dim);border-bottom:1px solid var(--line)}.pol{display:block;font-style:italic}
.plan .pb{padding:10px 12px}.leg{display:grid;grid-template-columns:70px 80px minmax(0,1fr);gap:8px;padding:6px 0;border-bottom:1px solid #edf0f4;font-size:11.5px}
.leg small{display:block;color:#98a2b3}.chipx{padding:2px 6px;border-radius:4px;font-size:8.5px;font-weight:750;text-transform:uppercase;border:1px solid #c4cff2;background:#f2f5ff;color:#3452ac}
.pc{display:grid;grid-template-columns:1fr 1fr;gap:18px;padding:0 12px 10px;font-size:10.5px;color:#667085}.pc .h{font-size:9px;text-transform:uppercase;color:#98a2b3;font-weight:700}.pc ul{margin:4px 0 0;padding-left:16px}
.pf{display:flex;align-items:center;gap:10px;padding:9px 12px;border-top:1px solid var(--line);background:#f8fafc;font-size:10px;color:var(--dim)}
.btn{border:1px solid var(--acc);border-radius:7px;background:var(--acc);color:#fff;min-height:32px;padding:6px 12px;font-size:11.5px;font-weight:650;cursor:pointer}
.btn.ok{background:#18785a;border-color:#18785a}.btn.sm{min-height:28px;padding:4px 9px;font-size:10.5px}.btn.ghost{background:#fff;border-color:var(--line2);color:#344054}
.doc{position:relative;margin:10px 0;padding:22px 24px;border:1px solid #d9dee7;border-radius:6px;background:#fffdf8;font-family:Georgia,serif}
.doc .lh{display:flex;gap:10px;align-items:center;padding-bottom:10px;margin-bottom:12px;border-bottom:2px double #c9ced8}
.doc .seal{width:38px;height:38px;border-radius:50%;border:2px solid #1d2433;display:grid;place-items:center;font-weight:700}
.doc .inst{font-weight:700}.doc .inst small{display:block;font-weight:400;font-size:10.5px;color:#5b6475}.doc .meta{display:flex;justify-content:space-between;font-size:11px;margin-bottom:10px}
.doc h3{text-align:center;letter-spacing:.14em;text-transform:uppercase;font-size:14px}.doc .bd{font-size:13px;line-height:1.7}.doc .sig{margin-top:20px;text-align:right;font-size:12px}
.doc .spec{margin-top:14px;padding-top:8px;border-top:1px dashed #cfd5df;color:#98a2b3;font:10px Inter,sans-serif;text-align:center}
.doc .wm{position:absolute;top:44%;left:0;right:0;text-align:center;font:800 56px Inter,sans-serif;color:rgba(196,50,71,.08);transform:rotate(-14deg)}
.doc-actions{margin:-2px 0 10px}
.acts{display:grid;gap:8px}.act{display:grid;grid-template-columns:4px minmax(0,1fr) auto;gap:0 12px;align-items:center;padding:10px 12px 10px 0;border:1px solid var(--line);border-radius:9px;background:#fff}
.act .sev{align-self:stretch;background:#a8b0bd}.act .dom{font-size:9px;font-weight:750;text-transform:uppercase;color:var(--dim)}.act .ttl{font-weight:650;font-size:12.5px}.act .det,.act .cmd{font-size:11px;color:var(--mut)}
@media(max-width:900px){
  header{padding:0 12px}.brand span{display:none}.me .n,.me .r{display:none}
  .tabs{display:flex;background:#fff;border-bottom:1px solid var(--line)}
  .tabs button{flex:1;height:42px;border:0;background:none;font-weight:600;color:var(--mut);border-bottom:2px solid transparent;cursor:pointer}
  .tabs button.on{color:var(--acc);border-bottom-color:var(--acc)}
  main{grid-template-columns:1fr}
  main>.col{display:none}main>.col.on{display:flex}main>.day.on{display:block}
  .day{padding:16px 14px;border-right:0}.stream{padding:16px 14px}.composer{padding:8px 12px 12px}
  .brow{grid-template-columns:minmax(90px,40%) minmax(0,1fr) 70px}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">VI</div>
    <div class="brand"><b>Vidyatech Institute</b><span id="roleLabel">My campus</span></div>
    <div class="spacer"></div>
    <div class="me" id="me" tabindex="0" role="button" aria-haspopup="true">
      <div class="av" id="av">··</div>
      <div><div class="n" id="meName">…</div><div class="r" id="meRole"></div></div>
      <div class="menu"><button type="button" data-m="pw">Change my password</button><button type="button" data-m="out">Sign out</button></div>
    </div>
  </header>
  <nav class="tabs"><button class="on" data-t="day">My day</button><button data-t="chat">Assistant</button></nav>
  <main>
    <section class="col day on" id="day">
      <div class="hd"><h2>My day</h2><button class="btn sm ghost" id="refresh" type="button">Refresh</button></div>
      <div id="home"><div class="loading">Loading your day…</div></div>
    </section>
    <section class="col chat" id="chat">
      <div class="stream" id="stream" aria-live="polite"></div>
      <div class="composer">
        <div class="chips" id="chips"></div>
        <div class="inp"><textarea id="ta" rows="1" placeholder="Ask anything about your classes, dues, passes, certificates…"></textarea>
          <button class="send" id="send" type="button">Send</button></div>
      </div>
    </section>
  </main>
</div>
<script src="/static/blocks.js"></script>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const SID='p-'+Math.random().toString(36).slice(2,8);
const api=(u,o)=>fetch(u,o).then(r=>{if(r.status===401){location.href='/login';throw new Error('signed out')}return r.json()});
const ROLE={student:'Student',faculty:'Faculty',hod:'Head of Department'};
let ME=null;

function push(who,html){
  const d=document.createElement('div');d.className='msg '+who;
  d.innerHTML=`<div class="ava">${who==='user'?esc((ME&&ME.name||'Me').split(' ').filter(w=>!/^(Dr|Prof)\.?$/.test(w)).map(w=>w[0]).join('').slice(0,2)):'VI'}</div><div class="bubble">${html}</div>`;
  $('#stream').appendChild(d);$('#stream').scrollTop=1e9;return d;
}
function chips(list){$('#chips').innerHTML=(list||[]).map(c=>`<button class="chip">${esc(c)}</button>`).join('');
  $$('#chips .chip').forEach(b=>b.onclick=()=>say(b.textContent));}
// a compact "how I got this": the agents that handled the turn, faults and holds marked
function path(trace){
  const seen=[];(trace||[]).forEach(t=>{const k=t.status==='error'?'e':t.status==='warn'?'w':/write_blocked/.test(t.action)?'h':'';
    const last=seen[seen.length-1];if(!last||last.a!==t.agent)seen.push({a:t.agent,k});else if(k)last.k=k;});
  return seen.length?`<div class="path" title="The agents that handled this">${seen.map(s=>`<span class="${s.k}">${esc(s.a)}</span>`).join('')}</div>`:'';
}
async function say(text){
  if(!text.trim())return;
  if(matchMedia('(max-width:900px)').matches)tab('chat');
  push('user',`<p>${esc(text)}</p>`);$('#ta').value='';
  const t=push('bot','<div class="typing"><i></i><i></i><i></i></div>');
  try{
    const r=await api('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text,session:SID})});
    t.querySelector('.bubble').innerHTML=(r.blocks||[]).map(rBlock).join('')+path(r.trace);
    chips(r.chips);
    if(r.refresh)loadHome();
  }catch(e){t.querySelector('.bubble').innerHTML='<p>The server is not reachable right now. Nothing was sent.</p>';}
  $('#stream').scrollTop=1e9;
}
async function loadHome(){
  const r=await api('/api/me/home');
  $('#home').innerHTML=(r.blocks||[]).map(rBlock).join('')||'<div class="loading">Nothing to show yet.</div>';
  if(!$('#chips').children.length)chips(r.chips);
}
function tab(t){$$('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  $('#day').classList.toggle('on',t==='day');$('#chat').classList.toggle('on',t==='chat');}
$$('.tabs button').forEach(b=>b.onclick=()=>tab(b.dataset.t));
$('#send').onclick=()=>say($('#ta').value);
$('#ta').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();say($('#ta').value)}});
$('#ta').addEventListener('input',e=>{e.target.style.height='auto';e.target.style.height=e.target.scrollHeight+'px'});
$('#refresh').onclick=loadHome;
$('#me').onclick=e=>{const b=e.target.closest('[data-m]');if(!b){$('#me').classList.toggle('open');return;}
  $('#me').classList.remove('open');b.dataset.m==='out'?signOut():changePassword();};
document.addEventListener('click',e=>{if(!e.target.closest('#me'))$('#me').classList.remove('open')});
document.addEventListener('click',e=>{const p=e.target.closest('[data-print]');if(!p)return;const d=document.getElementById(p.dataset.print);
  if(d){d.classList.add('printing');window.print();setTimeout(()=>d.classList.remove('printing'),300);}});
(async function boot(){
  const m=await api('/api/auth/me');ME=m.user;
  if(ME.role==='admin'){location.href='/';return;}
  const first=ME.name.replace(/^(Dr|Prof)\.\s*/,'').split(' ')[0];
  $('#meName').textContent=ME.name;
  $('#meRole').innerHTML=`${esc(ROLE[ME.role])}${ME.dept?' · '+esc(ME.dept):''}${m.demo?'<span class="demo" title="Demo mode: passwords are published">demo</span>':''}`;
  $('#av').textContent=ME.name.split(' ').filter(w=>!/^(Dr|Prof)\.?$/.test(w)).map(w=>w[0]).join('').slice(0,2);
  $('#roleLabel').textContent=ROLE[ME.role]+' portal';
  push('bot',`<p><strong>Hello, ${esc(first)}.</strong> I can see your ${ME.role==='student'?'classes, attendance, dues, passes and certificates':'classes, mentees and leave'}${ME.role==='hod'?', and your department':''} — and only yours. Anything that files or changes something is shown to you first; nothing is sent until you say <strong>yes</strong>.</p>`);
  loadHome();
})();
</script>
</body>
</html>
